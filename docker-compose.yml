services:
  signaling:
    build:
      context: .
      dockerfile: docker/signaling.Dockerfile
    environment:
      SPARTAN_SIGNALING_SECRET: ${SPARTAN_SIGNALING_SECRET:?Set SPARTAN_SIGNALING_SECRET to a long random value}
      SPARTAN_SIGNALING_ADMIN_SECRET: ${SPARTAN_SIGNALING_ADMIN_SECRET:-}
      SPARTAN_SIGNALING_ALLOWED_ORIGINS: ${SPARTAN_SIGNALING_ALLOWED_ORIGINS:-}
      SPARTAN_SIGNALING_MAX_CONNECTIONS: ${SPARTAN_SIGNALING_MAX_CONNECTIONS:-256}
      SPARTAN_SIGNALING_MAX_MESSAGES_PER_SECOND: ${SPARTAN_SIGNALING_MAX_MESSAGES_PER_SECOND:-120}
    ports:
      - '127.0.0.1:8790:8790'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
