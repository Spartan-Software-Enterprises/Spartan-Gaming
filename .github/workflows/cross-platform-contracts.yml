name: Cross-platform contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: ${{ matrix.platform }} contracts
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Run dependency-free contract suite
        run: npm test --ignore-scripts -- --test-concurrency=${{ matrix.platform == 'windows' && '1' || '8' }}
      - name: Run optional Werift adapter contract in isolation
        run: npm run test:werift
      - name: Run device presentation contract
        run: npm run test:platform
      - name: Run display policy contract
        run: npm run test:display
      - name: Validate Chromium target contract
        run: npm run chromium:validate -- --platform ${{ matrix.platform }}
      - name: Validate native package plan contract
        run: npm run native:plan -- --matrix --json
      - name: Validate signed browser adapter loader contract
        run: npm run test:browser-adapter
      - name: Validate Linux reference adapter contract
        run: npm run test:native-linux

  native-linux-package:
    name: native Linux package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install Node-API headers
        run: npm install --ignore-scripts --no-audit --no-fund node-api-headers@1.9.0
      - name: Build Linux Node-API package
        run: npm run native:build-linux
      - name: Test installed Linux package
        run: npm run test:native-linux-package
