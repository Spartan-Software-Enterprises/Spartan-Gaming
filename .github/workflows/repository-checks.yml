name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown and repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install formatting dependency
        run: npm ci --ignore-scripts
      - name: Check Prettier formatting
        run: npm run format:check
      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/check-repository.sh
      - name: Check for accidental credential files
        shell: bash
        run: |
          set -euo pipefail
          ! find . -path './.git' -prune -o \( -name '*.pem' -o -name '*.key' -o -name '.env' \) -print | grep -q .
