name: Native package rollout artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  native-package:
    name: native package artifact (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install native build dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build native package into an isolated rollout directory
        run: npm run native:plan -- --platform ${{ matrix.platform }} --out-root out/rollout-${{ matrix.platform }} --install-root out/rollout-${{ matrix.platform }}/install --execute
      - name: Write unsigned rollout marker
        shell: bash
        run: |
          node scripts/native/release-manifest.mjs --platform ${{ matrix.platform }} --install-root out/rollout-${{ matrix.platform }}/install --version build-${{ github.sha }} --output out/rollout-${{ matrix.platform }}/package-manifest.unsigned.json
          node -e "const fs=require('fs'); fs.writeFileSync('out/rollout-${{ matrix.platform }}/install/UNSIGNED-OPERATOR-SIGNATURE-REQUIRED.txt','This native package is a CI build artifact. Sign its adapter manifest through the external release signing service before installation.\n')"
      - name: Upload native rollout artifact
        uses: actions/upload-artifact@v7
        with:
          name: spartan-native-${{ matrix.platform }}-${{ github.sha }}
          path: |
            out/rollout-${{ matrix.platform }}/install
            out/rollout-${{ matrix.platform }}/package-manifest.unsigned.json
          if-no-files-found: error
          retention-days: 14
