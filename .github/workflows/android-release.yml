name: Android signed release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    name: Build and verify signed Android release
    runs-on: ubuntu-latest
    environment: android-release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Materialize the operator-managed keystore
        id: signing
        env:
          SPARTAN_ANDROID_KEYSTORE_B64: ${{ secrets.SPARTAN_ANDROID_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SPARTAN_ANDROID_KEYSTORE_B64"
          keystore="$RUNNER_TEMP/spartan-android-release.jks"
          printf '%s' "$SPARTAN_ANDROID_KEYSTORE_B64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "keystore=$keystore" >> "$GITHUB_OUTPUT"
      - name: Test and build signed release
        env:
          SPARTAN_ANDROID_KEYSTORE: ${{ steps.signing.outputs.keystore }}
          SPARTAN_ANDROID_KEY_ALIAS: ${{ secrets.SPARTAN_ANDROID_KEY_ALIAS }}
          SPARTAN_ANDROID_STORE_PASSWORD: ${{ secrets.SPARTAN_ANDROID_STORE_PASSWORD }}
          SPARTAN_ANDROID_KEY_PASSWORD: ${{ secrets.SPARTAN_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          npm run test:android-shell
          cd android
          ./gradlew --no-daemon :app:assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/spartan-android-release.sha256"
      - name: Upload signed release artifact
        uses: actions/upload-artifact@v7
        with:
          name: spartan-android-release-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            ${{ runner.temp }}/spartan-android-release.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary keystore
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/spartan-android-release.jks"
