name: Android signed release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing v-prefixed tag whose version exactly matches package.json'
        required: true
        type: string

permissions:
  contents: read

jobs:
  signed-release:
    name: Build and verify signed Android release
    runs-on: ubuntu-latest
    environment: android-release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
      - name: Verify release identity
        id: identity
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require(\"./package.json\").version")"
          test "$RELEASE_TAG" = "v$package_version"
          git tag --points-at HEAD | grep -Fx "$RELEASE_TAG"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install pinned Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Materialize the operator-managed keystore
        id: signing
        env:
          SPARTAN_ANDROID_KEYSTORE_B64: ${{ secrets.SPARTAN_ANDROID_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SPARTAN_ANDROID_KEYSTORE_B64"
          keystore="$RUNNER_TEMP/spartan-android-release.jks"
          printf '%s' "$SPARTAN_ANDROID_KEYSTORE_B64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "keystore=$keystore" >> "$GITHUB_OUTPUT"
      - name: Run synchronized release verification
        run: |
          set -euo pipefail
          npm run format:check
          npm run check
          npm test
          npm run test:serial
          npm run electron:test
          npm run test:android-shell
          npm run frontend:build
          npm run playwright:smoke
          node scripts/playwright/providers-deep.mjs
          node scripts/playwright/full-verification.mjs
      - name: Build and verify signed Android device profiles
        env:
          SPARTAN_ANDROID_KEYSTORE: ${{ steps.signing.outputs.keystore }}
          SPARTAN_ANDROID_KEY_ALIAS: ${{ secrets.SPARTAN_ANDROID_KEY_ALIAS }}
          SPARTAN_ANDROID_STORE_PASSWORD: ${{ secrets.SPARTAN_ANDROID_STORE_PASSWORD }}
          SPARTAN_ANDROID_KEY_PASSWORD: ${{ secrets.SPARTAN_ANDROID_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          cd android
          profiles=(phone tablet foldable androidTv fireTv)
          for profile in "${profiles[@]}"; do
            task="${profile^}"
            ./gradlew --no-daemon ":app:assemble${task}Release"
            source_apk="app/build/outputs/apk/${profile}/release/app-$profile-release.apk"
            output_apk="app/build/outputs/apk/release/Spartan-Gaming-${RELEASE_VERSION}-$profile-android.apk"
            cp "$source_apk" "$output_apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$output_apk"
            sha256sum "$output_apk" >> "$RUNNER_TEMP/spartan-android-release.sha256"
          done
      - name: Upload signed release artifact
        uses: actions/upload-artifact@v7
        with:
          name: spartan-android-release-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/release/Spartan-Gaming-*-android.apk
            ${{ runner.temp }}/spartan-android-release.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary keystore
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/spartan-android-release.jks"
